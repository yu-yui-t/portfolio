<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パジャマLP│寝返りしやすい快適設計</title>
  <link rel="icon" href="favicon.ico">
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

  <!-- FV -->
  <section class="fv">
    <div class="fv__inner">
      <div class="fv__content">
        <h1 class="fv__heading">朝までぐっすり。</h1>
        <p class="fv__subtext">寝返りしやすい快適設計</p>
      </div>
      <a href="#" class="fv__btn">
        <span>詳細を見る</span>
        <span class="fv__btn-arrow">▶</span>
      </a>
    </div>
    <!-- スクロール矢印 -->
    <div class="scroll-indicator">
      <span class="scroll-indicator__label">scroll</span>
      <span class="scroll-indicator__arrow"></span>
    </div>
  </section>

  <!-- お悩みセクション -->
  <section class="worries">
    <div class="worries__inner">
      <h2 class="worries__heading">こんなお悩みありませんか？</h2>
      <ul class="worries__list">
        <li class="worries__item">寝ても疲れが取れない</li>
        <li class="worries__item">肌ざわりが気になる</li>
        <li class="worries__item">おうち時間も快適に過ごしたい</li>
      </ul>
    </div>
  </section>

  <!-- 原因セクション -->
  <section class="features">
    <div class="features__inner">
      <h2 class="features__heading">その原因<span class="features__heading-em">"パジャマ"</span>かも？</h2>
      <div class="features__list">

        <!-- カード1 -->
        <article class="features__card">
          <div class="features__img-wrap">
            <img src="images/cause_01.jpg" alt="肌にやさしい素材" class="features__img">
          </div>
          <div class="features__body">
            <h3 class="features__title">肌にやさしい素材で、<br>ストレスフリー</h3>
            <p class="features__text">やわらかい生地が、寝ている間もやさしくフィット</p>
          </div>
        </article>

        <!-- カード2 -->
        <article class="features__card features__card--reverse">
          <div class="features__img-wrap">
            <img src="images/cause_02.jpg" alt="動きやすい設計" class="features__img">
          </div>
          <div class="features__body">
            <h3 class="features__title">動きやすい設計で<br>快適な眠りへ</h3>
            <p class="features__text">寝返りしてもつっぱらない、ストレスのない着心地</p>
          </div>
        </article>

        <!-- カード3 -->
        <article class="features__card">
          <div class="features__img-wrap">
            <img src="images/cause_03.jpg" alt="おうち時間も気分が上がるデザイン" class="features__img">
          </div>
          <div class="features__body">
            <h3 class="features__title">おうち時間も気分が<br>上がるデザイン</h3>
            <p class="features__text">リラックスしながらも、気分を高めてくれる一著</p>
          </div>
        </article>

      </div>
    </div>
  </section>

  <!-- CTAセクション -->
  <section class="cta">
    <div class="cta__inner">
      <p class="cta__text">毎日の眠りを、もっと心地よく。</p>
      <a href="#" class="cta__btn">
        <span>今すぐ詳細を見る</span>
        <span class="cta__btn-arrow">▶</span>
      </a>
    </div>
  </section>

</body>
</html>
